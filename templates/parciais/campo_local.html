<div class="mb-3">
    <label for="{{ campo.id_for_label }}" class="form-label">{{ campo.label }}</label>
    {{ campo }}
    <button type="button" class="btn btn-sm btn-outline-dark mt-2" id="botao-localizacao" hidden>Usar minha localização</button>
    <div class="form-text" id="aviso-localizacao" aria-live="polite"></div>
    {% for erro in campo.errors %}
        <div class="invalid-feedback d-block">{{ erro }}</div>
    {% endfor %}
</div>
